name: Update exchange rates

on:
  schedule:
    # Once a day, at 06:00 UTC — matches how often the underlying data
    # (ECB + partner central bank rates via Frankfurter) actually changes.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest rates
        run: node scripts/update-rates.mjs

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update exchange rates"
          file_pattern: "data/*.json"
